<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Códigos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: #fff;
      color: #111;
      padding: 2rem;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      align-items: start;
      max-width: 960px;
    }

    .form-group { margin-bottom: 1.2rem; }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.3rem;
      color: #333;
    }

    select, input[type="date"] {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      background: #fff;
      color: #111;
    }

    select:focus, input[type="date"]:focus {
      outline: none;
      border-color: #666;
    }

    .hospital-options {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .hospital-options label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: normal;
      cursor: pointer;
    }

    .hab-actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .btn-link {
      background: none;
      border: none;
      color: #555;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .btn-link:hover { color: #111; }

    .hab-container {
      border: 1px solid #ccc;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
    }

    .seccion { border-bottom: 1px solid #eee; }
    .seccion:last-child { border-bottom: none; }

    .seccion-titulo {
      padding: 0.35rem 0.5rem;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      background: #f5f5f5;
      border-bottom: 1px solid #eee;
    }

    .seccion-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      padding: 0.4rem;
    }

    .seccion-grid label {
      display: flex;
      align-items: center;
      gap: 2px;
      font-weight: normal;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-generar {
      width: 100%;
      padding: 0.55rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-generar:hover { background: #333; }

    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .results-bar span { font-weight: 500; color: #333; }

    .btn-copy {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.25rem 0.6rem;
      font-size: 12px;
      cursor: pointer;
      color: #555;
    }
    .btn-copy:hover { border-color: #666; color: #111; }

    .results-empty { color: #999; font-size: 13px; margin-top: 1rem; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    th {
      text-align: left;
      padding: 0.4rem 0.6rem;
      border-bottom: 2px solid #ddd;
      font-weight: 600;
      color: #555;
    }

    td {
      padding: 0.35rem 0.6rem;
      border-bottom: 1px solid #eee;
      color: #333;
    }

    td.codigo {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 600;
      color: #111;
      letter-spacing: 0.05em;
    }

    tr:hover td { background: #f9f9f9; }

    .table-wrap { max-height: 500px; overflow-y: auto; }

    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<h1>Generador de Códigos de Ticket</h1>

<div class="layout">

  <div>

    <div class="form-group">
      <label>Hospital</label>
      <div class="hospital-options" id="hospitalOptions"></div>
    </div>

    <div class="form-group">
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha">
    </div>

    <div class="form-group">
      <label for="tipoTicket">Tipo de Ticket</label>
      <select id="tipoTicket">
        <option value="0">1 HORA</option>
        <option value="1" selected>1 DÍA</option>
        <option value="2">2 DÍAS</option>
        <option value="3">3 DÍAS</option>
        <option value="4">4 DÍAS</option>
        <option value="5">5 DÍAS</option>
        <option value="6">6 DÍAS</option>
        <option value="7">7 DÍAS</option>
      </select>
    </div>

    <div class="form-group">
      <label for="cantidad">Cantidad de Tickets <small style="color:#999">(Ctrl+clic para varios)</small></label>
      <select id="cantidad" multiple size="8">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>

    <div class="form-group">
      <label>Habitaciones</label>
      <div class="hab-actions">
        <button class="btn-link" onclick="toggleTodas(true)">Todas</button>
        <button class="btn-link" onclick="toggleTodas(false)">Ninguna</button>
      </div>
      <div class="hab-container" id="habContainer"></div>
    </div>

    <button class="btn-generar" onclick="generar()">Generar códigos</button>

  </div>

  <div>
    <div class="results-bar">
      <span id="resultsTitle">Resultados</span>
      <button class="btn-copy" id="btnCopy" onclick="copiarTodo()" style="display:none">Copiar todo</button>
    </div>
    <div class="results-empty" id="resultsEmpty">Selecciona los parámetros y pulsa <em>Generar códigos</em>.</div>
    <div class="table-wrap" id="tableWrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Habitación</th>
            <th>ID Ticket</th>
            <th>Código</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="hospitales.js"></script>
<script src="ticket_generator.js"></script>
<script src="api.js"></script>
<script>
  document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

  // ── Hospitales ──
  const hospContainer = document.getElementById('hospitalOptions');
  HOSPITALES.forEach((h, idx) => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="radio" name="hospital" value="${h.id}" ${idx === 0 ? 'checked' : ''}> ${h.nombre}`;
    lbl.querySelector('input').addEventListener('change', () => renderHabitaciones(h));
    hospContainer.appendChild(lbl);
  });

  // ── Habitaciones dinámicas ──
  function renderHabitaciones(hospital) {
    const container = document.getElementById('habContainer');
    container.innerHTML = '';

    hospital.secciones.forEach(sec => {
      const secDiv = document.createElement('div');
      secDiv.className = 'seccion';

      if (!(hospital.secciones.length === 1 && sec.nombre === 'General')) {
        const titulo = document.createElement('div');
        titulo.className = 'seccion-titulo';
        titulo.textContent = sec.nombre;
        secDiv.appendChild(titulo);
      }

      const grid = document.createElement('div');
      grid.className = 'seccion-grid';

      sec.habitaciones.forEach(n => {
        const lbl = document.createElement('label');
        lbl.innerHTML = `<input type="checkbox" value="${n}"> ${n}`;
        grid.appendChild(lbl);
      });

      secDiv.appendChild(grid);
      container.appendChild(secDiv);
    });
  }

  renderHabitaciones(HOSPITALES[0]);

  function toggleTodas(checked) {
    document.querySelectorAll('#habContainer input[type="checkbox"]').forEach(cb => cb.checked = checked);
  }

  // ── Generar ──
  async function generar() {
    const hospital     = HOSPITALES.find(h => h.id === parseInt(document.querySelector('input[name="hospital"]:checked').value));
    const habitaciones = [...document.querySelectorAll('#habContainer input:checked')].map(cb => parseInt(cb.value));
    const cantidades   = [...document.getElementById('cantidad').selectedOptions].map(o => parseInt(o.value));
    const tipoTicket   = parseInt(document.getElementById('tipoTicket').value);
    const fechaStr     = document.getElementById('fecha').value;

    if (!fechaStr)            return alert('Selecciona una fecha.');
    if (!habitaciones.length) return alert('Selecciona al menos una habitación.');
    if (!cantidades.length)   return alert('Selecciona al menos una cantidad.');

    const [y, m, d] = fechaStr.split('-').map(Number);
    const fecha = new Date(y, m - 1, d);

    const resultados = await solicitarCodigos(hospital.id, habitaciones, tipoTicket, cantidades, fecha);

    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = resultados.map(r => `
      <tr>
        <td>${r.habitacion}</td>
        <td>${r.idTicket}</td>
        <td class="codigo">${r.codigo}</td>
      </tr>
    `).join('');

    document.getElementById('resultsEmpty').style.display = 'none';
    document.getElementById('tableWrap').style.display = 'block';
    document.getElementById('resultsTitle').textContent = `Resultados (${resultados.length})`;
    document.getElementById('btnCopy').style.display = 'inline';
  }

  // ── Copiar ──
  function copiarTodo() {
    const texto = [...document.querySelectorAll('#resultsBody tr')]
      .map(tr => {
        const celdas = tr.querySelectorAll('td');
        return `Hab ${celdas[0].textContent}\tID ${celdas[1].textContent}\t${celdas[2].textContent}`;
      }).join('\n');

    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.getElementById('btnCopy');
      btn.textContent = 'Copiado ✓';
      setTimeout(() => btn.textContent = 'Copiar todo', 2000);
    });
  }

  // ── Verificación: selector=5 → idTicket=4 → 15141813 ✓ ──
  const test = generarCodigo(20, 10, 1, 5, new Date(2026, 2, 22));
  console.log(`Verificación: ${test} ${test === '15141813' ? '✓ OK' : '✗ ERROR'}`);
</script>
</body>
</html>
