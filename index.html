<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Códigos</title>
  <style>


    :root {
      --bg: #fbfbfb;
      --surface: #ffffff;
      --surface2: #f0f0f0;
      --border: #d1d5db;
      --accent: #00e5a0;
      --accent-dim: #00e5a015;
      --accent-mid: #00e5a033;
      --text: #1f2937;
      --text-dim: #6b7280;
      --mono: monospace;
      --sans: sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .layout {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    /* ── Header ── */
    .header {
      grid-column: 1 / -1;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    .header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; }
    .header h1 span { color: var(--accent); }
    .header p { font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); }

    /* ── Panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .panel-title {
      padding: 0.6rem 1rem;
      font-family: var(--mono);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      background: var(--accent-dim);
    }

    /* ── Form fields ── */
    .field { padding: 1rem; border-bottom: 1px solid var(--border); }
    .field:last-child { border-bottom: none; }

    .field label {
      display: block;
      font-family: var(--mono);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    /* Fecha */
    input[type="date"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    input[type="date"]:focus { border-color: var(--accent); }

    /* Tipo ticket */
    select#tipoTicket {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    select#tipoTicket:focus { border-color: var(--accent); }

    /* Cantidad select multiple */
    select#cantidad {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82rem;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    select#cantidad:focus { border-color: var(--accent); }
    select#cantidad option { padding: 0.3rem 0.5rem; }
    select#cantidad option:checked { background: var(--accent); color: #0d0f14; }

    /* Checkboxes habitaciones */
    .hab-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .hab-grid::-webkit-scrollbar { width: 4px; }
    .hab-grid::-webkit-scrollbar-track { background: transparent; }
    .hab-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .hab-item {
      position: relative;
    }

    .hab-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }

    .hab-item label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.2rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--mono);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.12s;
      margin-bottom: 0;
      letter-spacing: 0;
    }

    .hab-item input:checked + label {
      background: var(--accent-mid);
      border-color: var(--accent);
      color: var(--accent);
    }

    .hab-item label:hover { border-color: var(--accent); color: var(--text); }

    .hab-actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .btn-small {
      font-family: var(--mono);
      padding: 0.25rem 0.6rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-small:hover { border-color: var(--accent); color: var(--accent); }

    /* Botón generar */
    .btn-generar {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #0d0f14;
      border: none;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn-generar:hover { opacity: 0.88; }
    .btn-generar:active { transform: scale(0.99); }

    /* ── Resultados ── */
    .results-panel {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--accent-dim);
    }

    .results-header span {
      font-family: var(--mono);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .results-count {
      background: var(--accent);
      color: #0d0f14;
      font-family: var(--mono);
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
    }

    .results-empty {
      padding: 3rem 1rem;
      text-align: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
    }

    .results-table th {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .results-table td {
      padding: 0.55rem 1rem;
      font-family: var(--mono);
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .results-table tr:last-child td { border-bottom: none; }
    .results-table tr:hover td { background: var(--accent-dim); }

    .code-cell {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .hab-cell { color: var(--text-dim); }
    .id-cell  { color: var(--text-dim); }

    /* Scroll tabla */
    .table-wrap {
      max-height: 520px;
      overflow-y: auto;
    }
    .table-wrap::-webkit-scrollbar { width: 4px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Copiar */
    .btn-copy {
      font-family: var(--mono);
      padding: 0.25rem 0.6rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .btn-copy.copied { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .header { grid-column: 1; }
    }
  </style>
</head>
<body>
<div class="layout">

  <div class="header">
    <h1>Generador de <span>Códigos</span></h1>
  </div>

  <!-- ── Panel izquierdo: formulario ── -->
  <div>
    <div class="panel">
      <div class="panel-title">Parámetros</div>

      <!-- Habitaciones -->
      <div class="field">
        <label>Habitaciones</label>
        <div class="hab-actions">
          <button class="btn-small" onclick="toggleTodas(true)">Todas</button>
          <button class="btn-small" onclick="toggleTodas(false)">Ninguna</button>
        </div>
        <div class="hab-grid" id="habGrid"></div>
      </div>

      <!-- Fecha -->
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>

      <!-- Tipo ticket -->
      <div class="field">
        <label>Tipo Ticket</label>
        <select id="tipoTicket">
          <option value="0">1 HORA</option>
          <option value="1" selected>1 DÍA</option>
          <option value="2">2 DÍAS</option>
          <option value="3">3 DÍAS</option>
          <option value="4">4 DÍAS</option>
          <option value="5">5 DÍAS</option>
          <option value="6">6 DÍAS</option>
          <option value="7">7 DÍAS</option>
        </select>
      </div>

      <!-- Cantidad -->
      <div class="field">
        <label>Cantidad de Tickets</label>
        <select id="cantidad" multiple size="5">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5" selected>5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>

    </div>

    <button class="btn-generar" onclick="generar()">Generar códigos</button>
  </div>

  <!-- ── Panel derecho: resultados ── -->
  <div class="panel results-panel" id="resultsPanel">
    <div class="results-header">
      <span>Resultados</span>
      <div style="display:flex;gap:0.5rem;align-items:center">
        <button class="btn-copy" id="btnCopy" onclick="copiarTodo()" style="display:none">Copiar todo</button>
        <span class="results-count" id="resultsCount" style="display:none">0</span>
      </div>
    </div>
    <div class="results-empty" id="resultsEmpty">
      Selecciona los parámetros<br>y pulsa <em>Generar códigos</em>
    </div>
    <div class="table-wrap" id="tableWrap" style="display:none">
      <table class="results-table">
        <thead>
          <tr>
            <th>Habitación</th>
            <th>ID Ticket</th>
            <th>Código</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="./ticket_generator.js"></script>
<script>
  // ── Inicializar fecha de hoy ──
  const hoy = new Date();
  document.getElementById('fecha').value = hoy.toISOString().split('T')[0];

  // ── Generar checkboxes de habitaciones (10-210) ──
  const grid = document.getElementById('habGrid');
  for (let h = 10; h <= 210; h++) {
    const item = document.createElement('div');
    item.className = 'hab-item';
    item.innerHTML = `
      <input type="checkbox" id="hab${h}" value="${h}">
      <label for="hab${h}">${h}</label>
    `;
    grid.appendChild(item);
  }

  function toggleTodas(checked) {
    grid.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checked);
  }

  function getHabitacionesSeleccionadas() {
    return [...grid.querySelectorAll('input:checked')].map(cb => parseInt(cb.value));
  }

  function getCantidadesSeleccionadas() {
    return [...document.getElementById('cantidad').selectedOptions].map(o => parseInt(o.value));
  }

  // ── Generar ──
  function generar() {
    const habitaciones = getHabitacionesSeleccionadas();
    const cantidades   = getCantidadesSeleccionadas();
    const tipoTicket   = parseInt(document.getElementById('tipoTicket').value);
    const fechaStr     = document.getElementById('fecha').value;

    if (!fechaStr)          return alert('Selecciona una fecha.');
    if (!habitaciones.length) return alert('Selecciona al menos una habitación.');
    if (!cantidades.length)   return alert('Selecciona al menos una cantidad.');

    const [y, m, d] = fechaStr.split('-').map(Number);
    const fecha = new Date(y, m - 1, d);

    const resultados = generarCodigos(habitaciones, tipoTicket, cantidades, fecha);

    // Renderizar tabla
    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = resultados.map(r => `
      <tr>
        <td class="hab-cell">${r.habitacion}</td>
        <td class="id-cell">${r.idTicket}</td>
        <td class="code-cell">${r.codigo}</td>
      </tr>
    `).join('');

    document.getElementById('resultsEmpty').style.display = 'none';
    document.getElementById('tableWrap').style.display = 'block';
    document.getElementById('resultsCount').textContent = resultados.length;
    document.getElementById('resultsCount').style.display = 'inline';
    document.getElementById('btnCopy').style.display = 'inline';
  }

  // ── Copiar todos los códigos ──
  function copiarTodo() {
    const filas = [...document.querySelectorAll('#resultsBody tr')];
    const texto = filas.map(tr => {
      const celdas = tr.querySelectorAll('td');
      return `Hab ${celdas[0].textContent}  ID ${celdas[1].textContent}  ${celdas[2].textContent}`;
    }).join('\n');

    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.getElementById('btnCopy');
      btn.textContent = 'Copiado ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copiar todo'; btn.classList.remove('copied'); }, 2000);
    });
  }

  // ── Verificación al cargar ──
  const test = generarCodigo(10, 1, 5, new Date(2026, 2, 22));
  console.log(`Verificación: ${test} ${test === '15141813' ? '✓ OK' : '✗ ERROR'}`);
</script>
</body>
</html>
